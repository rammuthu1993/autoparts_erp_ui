<div class="backdrop" (click)="$event.target === $event.currentTarget && vm.showAdjust.set(false)">
  <section class="modal" (click)="$event.stopPropagation()">
    <header><div><h2>Adjust stock</h2><p>{{ stock.productCode }} · {{ stock.productName }} · Current: {{ stock.quantity }} {{ stock.unit }}</p></div><button class="close" (click)="vm.showAdjust.set(false)">×</button></header>
    <form [formGroup]="vm.adjustmentForm" (ngSubmit)="vm.adjustStock()" class="form-grid">
      <label>Quantity change *<input type="number" step="0.001" formControlName="quantityChange" placeholder="Positive to add, negative to reduce"></label>
      <label>Reason *<input formControlName="reason" maxlength="250"></label>
      <label class="wide-field">Notes<textarea formControlName="notes" rows="3"></textarea></label>
      <footer class="wide-field"><button type="button" class="secondary" (click)="vm.showAdjust.set(false)">Cancel</button><button type="submit" class="primary" [disabled]="vm.saving()">Save adjustment</button></footer>
    </form>
  </section></div>
