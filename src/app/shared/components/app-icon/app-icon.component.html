<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('dashboard') {
      <rect x="3" y="3" width="8" height="8" rx="1.5" />
      <rect x="14" y="3" width="7" height="5" rx="1.5" />
      <rect x="14" y="11" width="7" height="10" rx="1.5" />
      <rect x="3" y="14" width="8" height="7" rx="1.5" />
    }
    @case ('shopping-cart') {
      <circle cx="9" cy="20" r="1" /><circle cx="19" cy="20" r="1" />
      <path d="M2 3h2l2.6 12.2a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 1.9-1.4L22 8H5" />
    }
    @case ('package') {
      <path d="m12 3 9 5-9 5-9-5 9-5Z" />
      <path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5" />
    }
    @case ('warehouse') {
      <path d="m3 10 9-7 9 7v11H3V10Z" /><path d="M9 21v-7h6v7M7 11h.01M12 11h.01M17 11h.01" />
    }
    @case ('users') {
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
    }
    @case ('truck') {
      <path d="M3 6h11v12H3zM14 10h4l3 3v5h-7z" />
      <circle cx="7.5" cy="19" r="1.8" /><circle cx="17.5" cy="19" r="1.8" />
    }
    @case ('wallet') {
      <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v16H6a3 3 0 0 1-3-3V6.5Z" />
      <path d="M3 8h17v5h-5a2 2 0 0 1 0-4h5" /><path d="M16 11.5h.01" />
    }
    @case ('chart') {
      <path d="M3 3v18h18" /><path d="m7 14 4-4 4 3 6-7" />
    }
    @case ('file-chart') {
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
      <path d="M14 2v6h6M8 17v-3M12 17v-6M16 17v-2" />
    }
    @case ('settings') {
      <circle cx="12" cy="12" r="3" />
      <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)" />
    }
    @case ('brain') {
      <path d="M12 18V5a3 3 0 0 0-5.8-1 3.5 3.5 0 0 0-2.4 5.8A3.5 3.5 0 0 0 6 16.5 3 3 0 0 0 12 18Z" />
      <path d="M12 18V5a3 3 0 0 1 5.8-1 3.5 3.5 0 0 1 2.4 5.8 3.5 3.5 0 0 1-2.2 6.7A3 3 0 0 1 12 18ZM8 8h.01M16 8h.01M8 13h.01M16 13h.01" />
    }
    @case ('receipt') {
      <path d="M5 3 7 4.5 9 3l3 1.5L15 3l2 1.5L19 3v18l-2-1.5-2 1.5-3-1.5L9 21l-2-1.5L5 21V3Z" />
      <path d="M8 9h8M8 13h8M8 17h5" />
    }
    @case ('tag') {
      <path d="M20 13 11 22l-9-9V2h11l9 9a1.4 1.4 0 0 1-2 2Z" /><circle cx="7.5" cy="7.5" r="1.2" />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
    }
    @case ('bell') {
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
    }
    @case ('menu') {
      <path d="M4 6h16M4 12h16M4 18h16" />
    }
    @case ('logout') {
      <path d="M10 17l5-5-5-5M15 12H3" /><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
    }
    @case ('arrow-up-right') {
      <path d="M7 17 17 7M7 7h10v10" />
    }
    @case ('refresh') {
      <path d="M20 7v5h-5M4 17v-5h5" /><path d="M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3" />
    }
    @case ('alert') {
      <path d="m12 3 10 18H2L12 3Z" /><path d="M12 9v5M12 17h.01" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="9" /><path d="m8 12 2.5 2.5L16 9" />
    }
    @default {
      <circle cx="12" cy="12" r="9" />
    }
  }
</svg>
